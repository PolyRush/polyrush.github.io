# Niveau de la semaine automatique : prépare les prochains lundis et met en place celui de la semaine.
# Il tourne chaque jour (et juste après minuit le lundi) ; le jeu passe tout seul au nouveau niveau le lundi à 00h00.
name: Niveau de la semaine
on:
  schedule:
    - cron: '7 4 * * *'        # chaque jour vers 5 h / 6 h (heure de Paris)
    - cron: '3 22,23 * * 0'    # dimanche soir UTC = lundi 00h03 à Paris (été / hiver)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: weekly, cancel-in-progress: false }
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.47.2 firebase-admin@12.5.0
      - run: npx playwright install --with-deps chromium
      - run: node .github/scripts/weekly.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # GitHub coupe les tâches planifiées d'un dépôt sans activité depuis 60 jours : une petite trace par mois l'évite
      - name: Garder la tâche active
        run: |
          d=$(date -u +%Y-%m)
          if [ "$(cat .github/weekly-alive 2>/dev/null)" != "$d" ]; then
            echo "$d" > .github/weekly-alive
            git config user.name "polyrush-bot"; git config user.email "polyrush-bot@users.noreply.github.com"
            git add .github/weekly-alive && git commit -m "Niveau de la semaine : tâche active ($d)" && git push || true
          fi
